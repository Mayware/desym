[package]
name = "desym"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
owo-colors = "4.3.0"
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "sync", "rt", "rt-multi-thread", "fs"] }
uuid = { version = "1.24.0", features = ["v4"] }

[profile.release]
strip = true
lto = true
